name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - vim-version: v8.2.1119
            git-mode: async
            vimb-sync: '0'
            term: xterm
          - vim-version: v8.2.1119
            git-mode: sync
            vimb-sync: '1'
            term: xterm-256color
          - vim-version: v9.0.0000
            git-mode: async
            vimb-sync: '0'
            term: xterm-256color
          - vim-version: stable
            git-mode: async
            vimb-sync: '0'
            term: xterm
          - vim-version: stable
            git-mode: sync
            vimb-sync: '1'
            term: xterm-256color
    name: Vim ${{ matrix.vim-version }} / ${{ matrix.git-mode }} / ${{ matrix.term }}
    env:
      TERM: ${{ matrix.term }}
      VIMB_SYNC: ${{ matrix.vimb-sync }}
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          version: ${{ matrix.vim-version }}
      - name: Install Git
        run: |
          sudo apt-get update
          sudo apt-get install -y git
      - name: Show tool versions
        run: |
          vim --version | head -5
          git --version
      - name: Run regression tests
        run: bash test/run.sh
      - name: Verify generated single-file distribution
        run: ./scripts/build.sh --check
      - name: Check script syntax
        run: |
          bash -n vimb
          bash -n install.sh
          bash -n test/install.sh
          bash -n scripts/build.sh
          bash -n scripts/verify-release-payload.sh
          ./vimb --version
      - name: Test installer checksum and version verification
        run: bash test/install.sh

  release-payload:
    name: Verify immutable release payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify installer default payload
        run: bash scripts/verify-release-payload.sh
